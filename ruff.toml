# Ruff config for the small `scripts/` directory (Python ≥ 3.10).
# Same defaults Ruff ships with, plus a couple of opinionated rules
# that catch the common gotchas in glue scripts.

target-version = "py310"
line-length = 100

exclude = ["models", "playwright-report", "test-results", "node_modules"]

[lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # import sorting
    "B",     # flake8-bugbear (likely bugs)
    "UP",    # pyupgrade — modern Python idioms
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # function calls in argument defaults are fine in scripts
]

[lint.per-file-ignores]
# Embedding script does mathy work; allow `*` imports / numpy variable names.
"scripts/generate_search_embeddings.py" = ["E741"]
