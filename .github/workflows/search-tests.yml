name: Search E2E Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'setup.html'
      - 'opensearch.xml'
      - 'search-embeddings.json'
      - 'search-config.json'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'serve.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'models/**'
      - 'scripts/search_phrases.json'
      - 'scripts/generate_search_embeddings.py'
      - '.github/workflows/search-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'setup.html'
      - 'opensearch.xml'
      - 'search-embeddings.json'
      - 'search-config.json'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'serve.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'models/**'
      - 'scripts/search_phrases.json'
      - 'scripts/generate_search_embeddings.py'
      - '.github/workflows/search-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Tests take ~4-6 min per engine. The headroom is for the capped,
    # retried system-deps install below, so a slow apt mirror doesn't eat the
    # test budget.
    timeout-minutes: 25

    # Each Playwright project (chromium / firefox / webkit / mobile-safari)
    # runs in its own job. Sharding by browser keeps each shard well under
    # the timeout and lets failures be diagnosed per-engine.
    # mobile-safari rides on the webkit binary, so the install step picks
    # the right binary based on the project name.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-safari]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # System packages come from the runner's Ubuntu apt mirror, which is
      # sometimes very slow (we've seen a 5 MB .deb take ~2 min). That used to
      # stall `install --with-deps` until the whole job timed out without
      # running a test. Cap each attempt and retry instead: apt keeps finished
      # downloads in /var/cache/apt/archives, so a retry resumes, not restarts.
      - name: Install Playwright system dependencies
        timeout-minutes: 14
        env:
          BROWSER: ${{ matrix.project == 'mobile-safari' && 'webkit' || matrix.project }}
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=30s 4m npx playwright install-deps "$BROWSER"; then
              exit 0
            fi
            echo "::warning::System deps for $BROWSER: attempt $attempt failed or ran past 4 min."
            # A kill mid-install can leave dpkg half-configured; repair before retrying.
            sudo dpkg --configure -a || true
            [ "$attempt" -lt 3 ] && sleep 10
          done
          echo "::error::Could not install system deps for $BROWSER after 3 attempts (usually a slow Ubuntu apt mirror; re-run the job)."
          exit 1

      # Browser binaries come from Playwright's CDN and are cached above.
      - name: Install Playwright browsers
        timeout-minutes: 5
        env:
          BROWSER: ${{ matrix.project == 'mobile-safari' && 'webkit' || matrix.project }}
        run: npx playwright install "$BROWSER"

      - name: Run Playwright tests
        env:
          PROJECT: ${{ matrix.project }}
        run: npx playwright test --project="$PROJECT"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
