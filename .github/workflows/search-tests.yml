name: Search E2E Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'setup.html'
      - 'opensearch.xml'
      - 'search-embeddings.json'
      - 'search-config.json'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'serve.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'models/**'
      - 'scripts/search_phrases.json'
      - 'scripts/generate_search_embeddings.py'
      - '.github/workflows/search-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'setup.html'
      - 'opensearch.xml'
      - 'search-embeddings.json'
      - 'search-config.json'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'serve.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'models/**'
      - 'scripts/search_phrases.json'
      - 'scripts/generate_search_embeddings.py'
      - '.github/workflows/search-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Each Playwright project (chromium / firefox / webkit / mobile-safari)
    # runs in its own job. Sharding by browser keeps each shard well under
    # the timeout and lets failures be diagnosed per-engine.
    # mobile-safari rides on the webkit binary, so the install step picks
    # the right binary based on the project name.
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-safari]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        env:
          BROWSER: ${{ matrix.project == 'mobile-safari' && 'webkit' || matrix.project }}
        run: npx playwright install --with-deps "$BROWSER"

      - name: Run Playwright tests
        env:
          PROJECT: ${{ matrix.project }}
        run: npx playwright test --project="$PROJECT"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
