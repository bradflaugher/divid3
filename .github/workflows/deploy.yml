name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

# Least privilege by default; the job widens only what it needs.
permissions: {}

# Never run two deploys at once, and never cancel one mid-upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scope the Cloudflare secrets to this environment (Settings →
    # Environments) so only this job can read them.
    environment:
      name: production
      url: https://divid3.com
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Publish only the files the site serves. Deploying `./` would also
      # put AGENTS.md, tests/, scripts/, package*.json and CI config on
      # divid3.com.
      - name: Stage public files
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.*' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='scripts/' \
            --exclude='playwright-report/' \
            --exclude='test-results/' \
            --exclude='*.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='playwright.config.ts' \
            --exclude='eslint.config.js' \
            --exclude='ruff.toml' \
            --exclude='serve.json' \
            ./ _site/
          test -f _site/index.html
          test -f _site/_headers
          test -f _site/models/sentence-transformers/all-MiniLM-L6-v2/onnx/model_quantized.onnx

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.146.0'
          command: pages deploy _site --project-name=divid3 --branch=main
