name: Lint

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'setup.html'
      - 'eslint.config.js'
      - 'ruff.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'search-config.json'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'setup.html'
      - 'eslint.config.js'
      - 'ruff.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'search-config.json'
      - '.github/workflows/lint.yml'

jobs:
  js:
    name: ESLint (HTML script tags + JS)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint:js

  py:
    name: Ruff (Python scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python3 -m pip install --upgrade ruff
      - name: Run Ruff
        run: ruff check scripts

  config:
    name: Validate search config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate search_phrases.json + search-config.json
        run: python3 scripts/validate_config.py
