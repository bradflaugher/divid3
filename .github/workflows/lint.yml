name: Lint

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'setup.html'
      - 'eslint.config.js'
      - 'tsconfig.json'
      - 'tests/**/*.ts'
      - 'playwright.config.ts'
      - 'ruff.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'scripts/**'
      - 'tests/unit/**'
      - 'search-config.json'
      - 'search-embeddings.json'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'setup.html'
      - 'eslint.config.js'
      - 'tsconfig.json'
      - 'tests/**/*.ts'
      - 'playwright.config.ts'
      - 'ruff.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'scripts/**'
      - 'tests/unit/**'
      - 'search-config.json'
      - 'search-embeddings.json'
      - '.github/workflows/lint.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    name: ESLint + TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify npm registry signatures and provenance
        run: npm audit signatures
      - name: Run ESLint
        run: npm run lint:js
      - name: Type-check Playwright specs
        run: npm run typecheck

  py:
    name: Ruff (Python scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install Ruff
        run: python3 -m pip install --require-hashes -r scripts/requirements-dev.txt
      - name: Run Ruff
        run: ruff check scripts tests/unit

  config:
    name: Validate search config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate search_phrases.json + search-config.json
        run: python3 scripts/validate_config.py

  unit:
    name: Routing unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt
      - name: Install model deps
        run: python3 -m pip install --require-hashes -r scripts/requirements.txt
      - name: Run routing unit tests
        run: python3 -m unittest discover -s tests/unit -v
